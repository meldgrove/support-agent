# Production setup: the release image as two processes, the admin interface
# (`web`) and the Slack bot (`bot`), after a one-off migration. The bot keeps
# answering when the admin interface is down or being updated.
#
#   cp .env.example .env    # then set the production values (docs/configuration.md)
#   docker compose up -d
#
# SUPPORT_AGENT_VERSION in .env selects the release of
# ghcr.io/meldgrove/support-agent, e.g. 0.1.0. To upgrade, read the release
# notes, change it, and run `docker compose up -d` again. A tag that moves
# (0.1, latest) lets `updater` install new releases (docs/deployment.md,
# Automatic updates). On a platform that does not pull images when it
# deploys, PULL_POLICY=always makes every start pull them again.
#
# Without a PostgreSQL of your own, add compose.postgres.yaml:
#   docker compose -f compose.yaml -f compose.postgres.yaml up -d
#
# Put a TLS-terminating reverse proxy in front of port 3000 and set APP_URL to
# its public https URL. The bot needs no public address: it connects to Slack.

x-image: &image ghcr.io/meldgrove/support-agent:${SUPPORT_AGENT_VERSION:?Set SUPPORT_AGENT_VERSION to a release, e.g. 0.1.0}

# Every variable in .env reaches the containers (docs/configuration.md); the
# required ones are checked here so a missing value stops the start.
x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  APP_URL: ${APP_URL:?Set APP_URL}
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
  OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
  # The reverse proxy in front of the app sets X-Forwarded-For.
  TRUST_PROXY: ${TRUST_PROXY:-true}

x-app: &app
  image: *image
  pull_policy: ${PULL_POLICY:-missing}
  env_file:
    - path: .env
      required: false
  environment: *app-environment

services:
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"

  web:
    <<: *app
    command: ["web"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/-/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  bot:
    <<: *app
    command: ["bot"]
    # The bot exits when Slack stays unreachable (BOT_WATCHDOG_SECONDS); the
    # restart policy starts a fresh process.
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Healthy while connected to Slack, or while Slack is not set up yet.
      test:
        - CMD
        - node
        - -e
        - "const s = require('node:fs').statSync('/tmp/bot-heartbeat', { throwIfNoEntry: false }); process.exit(s && Date.now() - s.mtimeMs < 90000 ? 0 : 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Automatic updates (docs/deployment.md): off until UPDATE_DEPLOY_HOOK_URL
  # is set. When the tag in SUPPORT_AGENT_VERSION points to a new image, it
  # calls that deploy link, and the platform deploys the new release.
  updater:
    image: ghcr.io/meldgrove/updater:0.1
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      IMAGE: *image
      DEPLOY_HOOK_URL: ${UPDATE_DEPLOY_HOOK_URL:-}
      DEPLOY_HOOK_TOKEN: ${UPDATE_DEPLOY_HOOK_TOKEN:-}
      # A release installs once it has been out this long, and only inside
      # the window, if one is set (e.g. 02:00-05:00, in the time zone TZ).
      COOLDOWN: ${UPDATE_COOLDOWN:-3d}
      WINDOW: ${UPDATE_WINDOW:-}
      TZ: ${TZ:-UTC}
      # Only while the image is private: a GitHub user and a token with
      # read:packages.
      REGISTRY_USERNAME: ${UPDATE_REGISTRY_USERNAME:-}
      REGISTRY_PASSWORD: ${UPDATE_REGISTRY_PASSWORD:-}
