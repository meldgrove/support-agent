# For Coolify only (docs/coolify.md); on a server, use compose.yaml. Coolify
# reads this file from the branch `stable`, which is at the newest release.
#
# Keep it in step with compose.yaml. It differs only in three points: `web`
# publishes no port, only `expose:` 3000 (Coolify's proxy reaches it over the Docker network; assign
# the domain to `web`, port 3000), every deploy pulls the images again (the tag
# in SUPPORT_AGENT_VERSION moves: a series such as 0.1, latest or preview),
# and `updater` calls Coolify's deploy link.
#
# PostgreSQL is a separate Coolify resource; set DATABASE_URL to its internal
# URL. The bot needs no domain: it connects to Slack.

x-image: &image ghcr.io/meldgrove/support-agent:${SUPPORT_AGENT_VERSION:?Set SUPPORT_AGENT_VERSION to a release, e.g. 0.1.0}

# Every variable in .env reaches the containers (docs/configuration.md); the
# required ones are checked here so a missing value stops the start.
x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  APP_URL: ${APP_URL:?Set APP_URL}
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
  OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
  # The reverse proxy in front of the app sets X-Forwarded-For.
  TRUST_PROXY: ${TRUST_PROXY:-true}
  # The update button asks `updater` (below).
  UPDATER_URL: ${UPDATER_URL:-http://updater:8080}

x-app: &app
  image: *image
  pull_policy: always
  env_file:
    - path: .env
      required: false
  environment: *app-environment

services:
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"

  web:
    <<: *app
    command: ["web"]
    restart: unless-stopped
    # Coolify takes the proxy port from here when the domain names none.
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/-/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  bot:
    <<: *app
    command: ["bot"]
    # The bot exits when Slack stays unreachable (BOT_WATCHDOG_SECONDS); the
    # restart policy starts a fresh process.
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Healthy while connected to Slack, or while Slack is not set up yet.
      test:
        - CMD
        - node
        - -e
        - "const s = require('node:fs').statSync('/tmp/bot-heartbeat', { throwIfNoEntry: false }); process.exit(s && Date.now() - s.mtimeMs < 90000 ? 0 : 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Automatic updates and the update button of admins (docs/coolify.md). With
  # UPDATE_DEPLOY_HOOK_URL set, it calls Coolify's deploy link when the tag in
  # SUPPORT_AGENT_VERSION points to a new image: the tag decides what installs,
  # so admins cannot choose the channel in Settings. Only the app reaches its
  # API (no ports).
  updater:
    image: ghcr.io/meldgrove/updater:0.2
    pull_policy: always
    restart: unless-stopped
    environment:
      IMAGE: *image
      VERSION_VARIABLE: SUPPORT_AGENT_VERSION
      DEPLOY_HOOK_URL: ${UPDATE_DEPLOY_HOOK_URL:-}
      DEPLOY_HOOK_TOKEN: ${UPDATE_DEPLOY_HOOK_TOKEN:-}
      # A release installs once it has been out this long, and only inside
      # the window, if one is set (e.g. 02:00-05:00, in the time zone TZ).
      COOLDOWN: ${UPDATE_COOLDOWN:-3d}
      WINDOW: ${UPDATE_WINDOW:-}
      TZ: ${TZ:-UTC}
      # Only while the image is private: a GitHub user and a token with
      # read:packages.
      REGISTRY_USERNAME: ${UPDATE_REGISTRY_USERNAME:-}
      REGISTRY_PASSWORD: ${UPDATE_REGISTRY_PASSWORD:-}
    volumes:
      - updater:/trigger

  # Backups for Meldgrove Backups (docs/deployment.md#backups): the database,
  # sent when Backups asks. Idle while BACKUP_URL is empty; it only reads and
  # opens no port.
  backup-agent:
    image: ghcr.io/meldgrove/backup-agent:0.1
    pull_policy: always
    restart: unless-stopped
    # The app's user, so that the agent reads every file the app writes.
    user: "1000:1000"
    environment:
      # From the app's source in Meldgrove Backups. Empty: the agent idles.
      BACKUP_URL: ${BACKUP_URL:-}
      BACKUP_TOKEN: ${BACKUP_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      APP_NAME: support-agent
      APP_IMAGE: *image
      # Settings a restore needs that are not in the backup (names only).
      APP_SECRETS: ENCRYPTION_KEY

volumes:
  updater:
